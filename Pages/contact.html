      <h1>World Vision International</h1>

        <li><a href="/index.html">Home</a></li>

  <!-- Main Content -->
  <main class="content">
    <h2>Contact Us</h2>
    <p>If you’d like to get involved, sponsor a child, or learn more, please reach out:</p>

    <!-- Contact Form Card -->
    <section class="contact-card">
      <h2>Send Us an Inquiry</h2>
      <form id="inquiry-form" novalidate>
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="Your Name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" placeholder="Inquiry Subject" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>

        <button type="submit" class="btn">Submit Inquiry</button>
      </form>
    </section>

    <!-- Google Map -->
    <section class="map-card">
      <h2>Find Us:</h2>
      <iframe 
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3637.397674144193!2d30.455650076137047!3d-24.262836787739108!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1ec3c1406ea4d973%3A0x1c12c7081f09646d!2sThe%20YouthHub%20World%20Vision!5e0!3m2!1sen!2sie!4v1756207904452!5m2!1sen!2sie" 
        width="100%" 
        height="300" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade"
        title="World Vision Location">
      </iframe>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 World Vision International | Designed by Tumiso Musuko</p>
  </footer>
</body>
